[package]
name = "klemmbrett"
version = "0.1.0"
edition = "2024"
description = "Minimalist, dumb and fast wayland native clipboard history manager"
repository = "https://github.com/xnacly/klemmbrett"
license = "MIT"
keywords = ["clipboard", "wayland", "clipboard-manager", "sway", "egui"]
categories = ["command-line-utilities", "gui"]
exclude = ["assets/screenshots", "assets/*.aseprite"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = "0.36.2"
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
