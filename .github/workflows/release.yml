name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build and attach binaries to
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          bin=klemmbrett-${{ matrix.arch }}-linux
          cp target/release/klemmbrett "$bin"
          sha256sum "$bin" > "$bin.sha256"
          gh release upload "$TAG" "$bin" "$bin.sha256" --clobber
